name: Actualizar feed de Instagram

# Capa "serverless": corre en los runners de GitHub, lee el token desde Secrets
# (nunca está en el código) y regenera instagram.json con las últimas publicaciones.

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch: {}      # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar últimas publicaciones
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/fetch_instagram.py

      - name: Commit si hay cambios
        run: |
          if ! git diff --quiet -- instagram.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add instagram.json
            git commit -m "chore: actualizar feed de Instagram"
            git push
          else
            echo "Sin cambios en instagram.json"
          fi
